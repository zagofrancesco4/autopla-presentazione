<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Autopla</title>
<meta name="description" content="Robot che innaffia i vasi del balcone">
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f7;--ink:#1c2330;--mut:#5a6472;--line:#dde2e8;--blu:#2a7de1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
#head .tt{flex:1;min-width:0}
#head h1{margin:0;font-size:17px;line-height:1.2;font-weight:750}
#head .sub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bCycle{flex:0 0 auto;min-height:42px;padding:0 14px;border:0;border-radius:21px;background:var(--blu);color:#fff;font-weight:700;font-size:15px}
#viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none}
#viewport canvas{display:block;touch-action:none}
#labels{position:absolute!important;top:0;left:0;pointer-events:none;z-index:1}
#hint{position:absolute;left:10px;top:8px;z-index:2;font-size:12.5px;color:var(--mut);background:rgba(255,255,255,.85);border-radius:10px;padding:5px 9px;pointer-events:none}
#bHome{position:absolute;right:10px;bottom:10px;z-index:2;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#vistePres{position:absolute;right:10px;top:8px;z-index:2;display:flex;gap:6px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#vistePres::-webkit-scrollbar{display:none}
#vistePres button{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:13.5px;font-weight:650;white-space:nowrap}
#vistePres button.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:767px){#hint{top:52px}#vistePres{left:10px;right:10px}}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px}
#sheet{flex:0 0 auto;max-height:42%;display:flex;flex-direction:column;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,30,40,.08);border-radius:16px 16px 0 0;position:relative;z-index:3}
#sheetHead{display:flex;align-items:center;gap:10px;padding:10px 8px 6px 14px}
#sheetHead .badge{flex:0 0 auto;width:30px;height:30px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:15px}
#sheetHead .ht{flex:1;min-width:0}
#sheetTitle{font-size:18px;font-weight:750;line-height:1.2}
#sheetSub{font-size:13.5px;color:var(--mut);line-height:1.3;margin-top:1px}
#sheetClose{flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;font-size:22px;color:var(--mut)}
#sheetBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 16px;font-size:14.5px;line-height:1.45}
.pzs{display:flex;flex-wrap:wrap;gap:7px}
.pz{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:#fbfcfd;border-radius:12px;padding:8px 11px;margin:0;font-size:14.5px;font-weight:650;min-height:42px}
.pz .sw{flex:0 0 auto;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.pz.hit{border-color:#ff2d55;background:#fff2f5}
.pz.mechgo{margin-top:9px;width:100%;justify-content:center;background:var(--blu);border-color:var(--blu);color:#fff}
.cyc .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#cStep{font-weight:700;font-size:15.5px}#cMl{font-weight:750;color:var(--blu);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:#e6ebf0;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blu);width:0}
.cbtns{display:flex;gap:8px;margin-top:10px}.cbtns button:disabled{opacity:.4}.cbtns button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:15px}
#parts{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:8px 10px 10px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none;position:relative;z-index:4}
#parts::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;display:flex;align-items:center;gap:7px;min-height:44px;padding:0 13px 0 7px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:14.5px;font-weight:650}
.pc .n{width:26px;height:26px;border-radius:13px;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750}
.pc.on{background:var(--ink);border-color:var(--ink);color:#fff}.pc.on .n{background:#fff;color:var(--ink)}
.dot{pointer-events:auto;width:30px;height:30px;border-radius:15px;border:2px solid #fff;background:var(--ink);color:#fff;font:750 14px/1 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0}
.lbl{font:600 11.5px/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:rgba(255,255,255,.94);color:#1c2330;border:1px solid #cfd6de;border-radius:8px;padding:3px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lbl.ex{background:#1c2330;color:#fff;border-color:#1c2330;font-size:12px}
.lbl.q{background:#fffbe6;border-color:#e3c86a;color:#4a3a00;font-size:12.5px}
.lbl.done{background:#e8f2ff;border-color:#2a7de1;color:#0f3d75}
@media (min-width:900px) and (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto}
  #head{grid-column:1/3}#parts{grid-column:1/3}
  #viewport{grid-column:1;grid-row:2}
  #sheet{grid-column:2;grid-row:2;max-height:none;min-height:0;border-radius:0;border-top:0;border-left:1px solid var(--line)}
  #app.nosheet #viewport{grid-column:1/3}
}
/* Meccanismo (gemello digitale) */
#mech{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
#mechHead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:#fff;border-bottom:1px solid var(--line)}
#mechHead .tt{flex:1;min-width:0}
#mechHead h2{margin:0;font-size:17px;line-height:1.2;font-weight:750}
#mechHead .sub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mechCk,#mechColor{flex:0 0 auto;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:20px;background:#fff;font-weight:650;font-size:14px}
#mechClose{flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;font-size:22px;color:var(--mut)}
#mechView{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none}
#mechView canvas{display:block;touch-action:none}
#mechLabels{position:absolute!important;top:0;left:0;pointer-events:none;z-index:1}
#mechChecks{position:absolute;left:10px;top:10px;z-index:2;width:min(440px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35}
#mechChecks h3{margin:6px 0 3px;font-size:12px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
#mechChecks h3:first-child{margin-top:0}
.ck{display:flex;gap:6px;align-items:flex-start;margin:2px 0}
.ck b{flex:0 0 auto;font-size:10.5px;border-radius:5px;padding:0 5px;height:17px;line-height:17px}
.ck.ok b{background:#e3f4e8;color:#16723a}.ck.wn b{background:#fff3cd;color:#8a5a00}.ck.ko b{background:#fde7e9;color:#b3261e}
.ck span{min-width:0}.ck i{font-style:normal;color:var(--mut)}
#mechBar{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:8px 10px 10px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}
#mechBar::-webkit-scrollbar{display:none}
#mechBar button{flex:0 0 auto;min-height:42px;padding:0 13px;border-radius:21px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:650;white-space:nowrap}
#mechBar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
#mechPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:3;width:min(460px,calc(100% - 20px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;box-shadow:0 2px 10px rgba(20,30,40,.08)}
.mrow{display:flex;align-items:center;gap:10px;min-height:32px;font-variant-numeric:tabular-nums}.mrow input{flex:1}.mrow i{font-style:normal;color:var(--mut)}
#mechInfo{position:absolute;right:10px;top:10px;z-index:3;max-width:min(380px,calc(100% - 20px));background:#fffbe6;border:1px solid #e3c86a;color:#4a3a00;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.4}
.warnx{font-weight:750;color:#b3261e}
.mtag{font:650 11.5px/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1c2330;color:#fff;border-radius:7px;padding:3px 7px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mdot{width:7px;height:7px;border-radius:4px;background:#1c2330;border:1.5px solid #fff}
#mechTags{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#mechTags .mtag{position:absolute;left:0;top:0}
#mechLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#mechScale{position:absolute;left:10px;bottom:44px;z-index:3;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 8px 4px;font:650 11.5px system-ui,sans-serif}
#mechScaleBar{height:6px;border:2px solid #1c2330;border-top:0;margin-bottom:2px}
#mechLegend{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px);pointer-events:none}
#mechLegend span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:12px;font-weight:650}
#mechLegend i{width:11px;height:11px;border-radius:3px}
#mechLegend.off{display:none}
@media (max-width:520px){#mechHead .sub{display:none}#mechCk,#mechColor{padding:0 9px;font-size:13px}}
.mlbl.mq{background:#fffbe6;border-color:#e3c86a;color:#4a3a00;font-size:11.5px}
.mlbl{font:600 11px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:rgba(255,255,255,.94);color:#1c2330;border:1px solid #cfd6de;border-radius:6px;padding:2px 5px;white-space:nowrap}
</style>
</head>
<body>
<div id="app" class="nosheet">
  <header id="head">
    <div class="tt">
      <h1>Autopla</h1>
      <div class="sub">Robot che innaffia i vasi del balcone</div>
    </div>
    <button id="bCycle">▶ Ciclo</button>
  </header>

  <div id="viewport">
    <div id="loading">Caricamento…</div>
    <div id="hint">Tocca un numero o un pezzo · tocca la box per il dettaglio</div>
    <button id="bHome" title="Rimetti la vista" aria-label="Rimetti la vista">⟲</button>
    <div id="vistePres"><button data-q="panoramica">Panoramica</button><button data-q="rotaia">Rotaia e vasi</button><button data-q="segui">Segui il carrello</button><button data-q="dettaglio">Dettaglio meccanismo</button><button id="bLuce">Giorno</button></div>
  </div>

  <section id="sheet" hidden>
    <div id="sheetHead">
      <div class="badge" id="sheetBadge">1</div>
      <div class="ht"><div id="sheetTitle"></div><div id="sheetSub"></div></div>
      <button id="sheetClose" aria-label="Chiudi">✕</button>
    </div>
    <div id="sheetBody"></div>
  </section>

  <nav id="parts"></nav>
</div>

<div id="mech" hidden>
  <header id="mechHead">
    <div class="tt"><h2>Meccanismo</h2><div class="sub" id="mechSub">Gemello digitale del meccanismo</div></div>
    <button id="mechColor">Colori: funzioni</button>
    <button id="mechCk">Controlli</button>
    <button id="mechClose" aria-label="Chiudi">✕</button>
  </header>
  <div id="mechView"><div id="mechChecks"></div><div id="mechInfo" hidden></div><div id="mechLegend"></div><div id="mechPanel" hidden></div>
    <svg id="mechLines"></svg><div id="mechTags"></div>
    <div id="mechScale" hidden><div id="mechScaleBar"></div><span id="mechScaleT"></span></div></div>
  <nav id="mechBar">
    <button data-a="animazione">▶ Animazione</button><button data-a="esploso">Esploso</button><button data-a="sezione">Sezione</button>
    <button data-a="eccentrico">Eccentrico</button><button data-a="trasparenza">Trasparenza box</button><button data-a="etichette">Etichette</button>
    <button data-v="fronte">Fronte</button><button data-v="lato">Lato</button><button data-v="alto">Alto</button><button data-v="iso">Isometrica</button>
    <button data-a="reset">⟲ Reset</button>
  </nav>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   CONFIG — FONTE UNICA DELLE MISURE DEL MECCANISMO (1 unità = 1 mm)
   Riferimento: X = direzione di marcia (asse della rotaia), Y = verticale,
   Z = orizzontale verso la ringhiera (in sezione: box a sinistra, ringhiera a destra).
   Origine Y/Z = asse del tubo. Ogni geometria del meccanismo si costruisce solo da qui.
   Dopo una modifica: AUTOPLA.rebuild() (console) ricostruisce e ricontrolla tutto.
   ===================================================================== */
const CONFIG = {
  tubo: {
    lato: 40,               // dato utente: tubo quadro (confermato)
    spessore: 2,            // dato utente
    raggioEsterno: 1,       // dato utente — IPOTESI: oltre 1,5 mm la gola delle V623 non appoggia sui fianchi
    lunghezza: 4500         // dato utente
  },
  vista: {
    inizio: 800,            // scelta di modello: X d'inizio del tratto disegnato (contiene giunzione e staffa)
    lunghezza: 600,         // dato utente: tratto di rotaia modellato
    carrello: 1210          // scelta di modello: carrello sopra la staffa (ferro a X 1210) = caso peggiore
  },
  cremagliera: {
    modulo: 1,              // dato utente
    angoloPressione: 20,    // dato utente (profilo di riferimento ISO 53)
    addendum: 1,            // standard ISO 53: 1·m
    dedendum: 1.25,         // standard ISO 53: 1,25·m
    larghezza: 15,          // dato utente
    altezza: 15,            // dato utente
    altezzaPrimitiva: 14,   // standard cremagliere 15x15 m1 (altezza − addendum) — IPOTESI: verificare datasheet
    spezzone: 1000,         // dato utente: lunghezza nominale di uno spezzone
    inizio: 0,              // IPOTESI: la prima cremagliera parte dall'inizio del tubo
    vite: 'M4',             // dato utente
    passoViti: 100,         // dato utente
    primaVite: 50,          // IPOTESI: prima vite a mezzo passo dall'estremità dello spezzone
    giocoTestaFondo: 1,     // IPOTESI: testa della vite 1 mm sotto il fondo dei denti (lamatura)
    inserto: 6              // IPOTESI: inserto filettato a rivetto M4 nella parete del tubo (filetto utile)
  },
  pignone: {
    denti: 20,              // dato utente
    larghezza: 15,          // dato utente
    foro: 5,                // dato utente
    grano: 'M3',            // dato utente
    lunghezzaGrano: 4       // IPOTESI: grano ISO 4026 M3x4 nel vano tra due denti
  },
  motore: {
    lato: 42.3,             // datasheet NEMA17 (dato utente: 42 nominale)
    lunghezza: 23,          // dato utente: NEMA17 pancake 42 x 23
    smusso: 4,              // IPOTESI: smusso a 45° sugli spigoli del corpo
    flangiaD: 22,           // datasheet NEMA17
    flangiaH: 2,            // datasheet NEMA17
    alberoD: 5,             // datasheet NEMA17
    alberoL: 24,            // IPOTESI (STEPPERONLINE pancake, codice da confermare), dalla faccia di montaggio
    piatto: 0.5,            // IPOTESI: profondità del piatto (D-cut)
    piattoL: 15,            // IPOTESI: lunghezza del piatto
    interasseFori: 31,      // datasheet NEMA17
    viteFori: 'M3',         // datasheet NEMA17
    profonditaFiletto: 4.5, // IPOTESI: profondità filetto dei fori M3 (sui pancake spesso minore)
    connettore: { larghezza: 16, altezza: 6, sporgenza: 5.8 }, // IPOTESI: connettore 6 pin tipo JST-PH sul retro
    spazioSpina: 10         // IPOTESI: spina + curvatura dei cavi dietro al motore
  },
  piastraMotore: {
    spessore: 3,            // dato utente
    larghezza: 50,          // IPOTESI
    regolazione: 1,         // IPOTESI: corsa ± delle asole verticali (mm)
    giocoFlangia: 0.5,      // IPOTESI: gioco radiale attorno alla flangia Ø22
    aletta: 18,             // IPOTESI: aletta piegata sotto il coperchio (18: teste M3 lontane da quelle del motore)
    interasseViti: 30,      // IPOTESI: due viti M3 sull'aletta
    viteAletta: 'M3'        // IPOTESI
  },
  ruote: {
    modello: 'V623ZZ',      // dato utente: prototipo con V623ZZ; alternativa '624VV' (tutto si ricostruisce, eccentrico incluso)
    catalogo: {
      V623ZZ: {             // Hilitand, annuncio Amazon.it: la ruota è il cuscinetto, niente mozzo
        diametro: 12, larghezza: 4, foro: 3,      // dato annuncio (3x12x4)
        profonditaGola: 1.4, angoloGola: 90,      // profondità: dato annuncio (Ø fondo gola 9,2); angolo: IPOTESI
        vite: 'M3',                               // dato utente
        spallamento: { d: 5, l: 1 }, distanziale: { d: 5, l: 2.5 }, // IPOTESI: appoggio solo sull'anello interno
        eccentrico: { esagono: 8, gamboD: 7.12 }, // IPOTESI
        materiale: 'acciaio al carbonio (non inox: ruggine)'        // dato annuncio
      },
      '624VV': {            // IPOTESI utente: 4x13x6, Ø fondo gola 9,0
        diametro: 13, larghezza: 6, foro: 4,
        profonditaGola: 2.0, angoloGola: 90,
        vite: 'M4',
        spallamento: { d: 6, l: 1 }, distanziale: { d: 6, l: 2.5 }, // IPOTESI
        eccentrico: { esagono: 10, gamboD: 8.5 }, // IPOTESI (foro M4 + eccentricità 0,75)
        materiale: 'IPOTESI: da verificare'
      }
    },
    get sel() { return this.catalogo[this.modello]; },
    get diametro() { return this.sel.diametro; }, get larghezza() { return this.sel.larghezza; }, get foro() { return this.sel.foro; },
    get profonditaGola() { return this.sel.profonditaGola; }, get angoloGola() { return this.sel.angoloGola; }, get vite() { return this.sel.vite; },
    get spallamento() { return this.sel.spallamento; }, get distanziale() { return this.sel.distanziale; }, get materiale() { return this.sel.materiale; },
    testa: 'bombata',       // scelta: viti ISO 7380 a testa bombata, la testa non sporge oltre la ruota
    passo: 80,              // dato utente: distanza tra stazione anteriore e posteriore
    supporto: { sezione: 10, spessore: 8, fondoDado: 1 }, // IPOTESI: blocchetto PETG a 45° con dado imprigionato
    laterale: { y: -8, mozzo: 10, fondoDado: 2 },  // IPOTESI: quota asse ruota laterale, mozzo PETG con dado imprigionato
    inferiore: { z: -12 },  // IPOTESI: ruota inferiore sotto la metà sinistra del tubo (blocchetto fuori dall'ingombro del tubo)
    // derivata (non modificare): sporgenza della ruota superiore destra oltre la faccia destra del tubo.
    // Gola con vertice sullo spigolo virtuale, asse a 45°: (raggio vertice gola + larghezza/2 + raggio esterno) / √2
    get sporgenzaSupDx() { const R = this.diametro / 2; return (R - this.profonditaGola + this.larghezza / 2 + R) / Math.SQRT2; }
  },
  eccentrico: {

const hoseTube = add(new THREE.BufferGeometry(), mat.acqua, gTube);
const hoseCable = add(new THREE.BufferGeometry(), mat.cavo, gCab);
function hosePts(bx, zr, z, gz, kind) {
  const lead = bx - 5, xs = [35];
  for (let i = 1; i <= N_RINGS; i++) xs.push(35 + (lead - 35) * i / (N_RINGS + 1));
  xs.push(lead);
  const pts = [V(24, 53.9, zr), V(29.5, 55.7, (zr + z) / 2), V(35, HOSE_Y, z)];
  for (let i = 1; i < xs.length; i++) {
    const a = xs[i - 1], b = xs[i], s = b - a;
    if (s > 3) pts.push(V((a + b) / 2, HOSE_Y - Math.min(1, s * .06), z));
    pts.push(V(b, HOSE_Y, z));
  }
  const E = window.MAINM && window.MAINM.root.visible ? window.MAINM.gland(kind) : null;   // pressacavo / passaparete della box nuova
  // dal filo il tubo scende sotto la box lontano dal braccetto (≥ 3 cm di lato), poi entra nel passaparete dal lato balcone
  if (E) pts.push(V(Math.min(E.x, bx) - 3.2, (HOSE_Y + E.y) / 2 - 3, E.z + 2), V(E.x - 1.8, E.y - 1.5, E.z + 4), V(E.x, E.y, E.z + 2.5), V(E.x, E.y, E.z));
  else pts.push(V(bx - 3.6, 59.6, (z + gz) / 2), V(bx - 2, 62.7, gz));
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) if (pts[i].distanceTo(out[out.length - 1]) > .35) out.push(pts[i]);
  return { pts: out, xs };
}
let lastHoseX = null;
function updateHose(bx) {
  if (lastHoseX !== null && Math.abs(bx - lastHoseX) < .02) return;
  lastHoseX = bx;
  const a = hosePts(bx, 7, 3.4, 4.4, 'tubo'), b = hosePts(bx, 9.4, 4.6, 5.9, 'cavo');
  hoseTube.geometry.dispose(); hoseCable.geometry.dispose();
  hoseTube.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(a.pts, false, 'centripetal'), 120, .4, 6, false);
  hoseCable.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(b.pts, false, 'centripetal'), 120, .3, 6, false);
  for (let i = 0; i < N_RINGS; i++) rings[i].position.x = a.xs[i + 1];
  const out = bx - HOME;
  setWound(7.6 - out / 130 * 1.6);
  reelSpin.rotation.z = -out / 6.5;
  motSpin.rotation.z = out / 1.75;
  idlerSpin.rotation.z = out / 1.75;
}

const tmpM = new THREE.Matrix4(), zeroM = new THREE.Matrix4().makeScale(0, 0, 0);
for (let i = 0; i < DROPS; i++) dropMesh.setMatrixAt(i, zeroM);
let spawnAcc = 0;
function updateDrops(dt, emitting) {
  if (emitting) {
    spawnAcc += dt * 70;
    const tip = window.MAINM && window.MAINM.root.visible ? window.MAINM.tip() : pivot.localToWorld(V(0, -ARM_L - .2, 0));
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      const d = drops.find(q => !q.on); if (!d) break;
      d.on = true; d.p.copy(tip).add(V((Math.random() - .5) * .8, 0, (Math.random() - .5) * .8));
      d.v.set((Math.random() - .5) * 4, -25 - Math.random() * 10, (Math.random() - .5) * 4);
    }
  }
  for (let i = 0; i < DROPS; i++) {
    const d = drops[i];
    if (d.on) {
      d.v.y -= 260 * dt; d.p.addScaledVector(d.v, dt);
      if (d.p.y < 22.8) d.on = false;
    }
    dropMesh.setMatrixAt(i, d.on ? tmpM.makeTranslation(d.p.x, d.p.y, d.p.z) : zeroM);
  }
  dropMesh.instanceMatrix.needsUpdate = true;
}

const CYCLE_HTML = `<div class="cyc">
<div class="row"><span id="cStep"></span><span id="cMl"></span></div>
<div class="bar"><i id="cBar"></i></div>
<div class="cbtns"><button id="cPause">❚❚ Pausa</button><button id="cRestart">↺ Ricomincia</button></div>
</div>`;
function cycleUI() {
  if (current !== 'ciclo') return;
  const st = STEPS[Math.max(0, S.step)];
  const done = !S.running && S.step === STEPS.length - 1;
  $('cStep').textContent = S.paused ? `${st.title} (pausa)` : st.title;
  $('cMl').textContent = done ? `${Math.round(S.total)} ml` : (st.t === 'water' ? `${Math.round(S.ml)} / ${ML_VASO} ml` : `${Math.round(S.total)} ml`);
  $('cBar').style.width = ((S.step + 1) / STEPS.length * 100) + '%';
  const bp = $('cPause'); bp.disabled = !S.running; bp.textContent = S.paused ? '▶ Riprendi' : '❚❚ Pausa';
}
function syncCycleBtn() {
  $('bCycle').textContent = S.running ? (S.paused ? '▶ Riprendi' : '● In corso') : '▶ Ciclo';
}
function enterStep(i) {
  S.step = i; S.el = 0; const st = STEPS[i]; S.from = S.bx;
  S.dur = st.t === 'move' ? Math.max(.6, Math.abs(st.to - S.bx) / 24) : st.dur;
  if (st.t === 'water') { S.ml = 0; S.tank0 = S.tank; }
  cycleUI();
}

  Object.assign(S, { bx: HOME, arm: 0, running: false, paused: false, step: -1, ml: 0, total: 0, tank: 10, watering: false });
  potLabels.forEach(p => { p.d.textContent = p.base; p.d.classList.remove('done'); });
  for (const d of drops) d.on = false;

}

  S.watering = false;
  if (!S.running || S.paused) return;
  const st = STEPS[S.step];
  S.el += dt;
  const k = Math.min(1, S.el / S.dur);
  if (st.t === 'move') S.bx = S.from + (st.to - S.from) * ease(k);
  else if (st.t === 'down') S.arm = ARM_DEG * ease(k);
  else if (st.t === 'up') S.arm = ARM_DEG * (1 - ease(k));
  else if (st.t === 'water') {

    cycleUI();
  }
  if (k >= 1) {
    if (S.step + 1 < STEPS.length) enterStep(S.step + 1);
    else { S.running = false; S.paused = false; syncCycleBtn(); cycleUI(); }
  }
}

/* Tocco sul disegno */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
function pick(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let hits = ray.intersectObjects(pickables, false).filter(h => h.object.visible && h.object.material !== ghostMat);
  if (current === 'braccetto') hits = hits.filter(h => h.point.x <= clipPlanes[0].constant + .2 && h.point.x >= -clipPlanes[1].constant - .2);
  if (!hits.length) return;
  let h = hits[0];
  if (h.object.userData.container) {
    const bb = new THREE.Box3().setFromObject(h.object.parent).expandByScalar(.5);
    const inner = hits.find(q => !q.object.userData.container && bb.containsPoint(q.point));
    if (inner) h = inner;
  }
  const key = keyOf(h.object);
  if (BOXKEYS.includes(key) || key === 'carrello') { window.AUTOPLA && AUTOPLA.open(); return; }  // la box apre il dettaglio del meccanismo
  const cur = PART[current];
  if (cur && cur.keys.includes(key)) { highlight(key); return; }
  let target = TAP_ORDER.find(id => PART[id].keys.includes(key));
  if (target === undefined && key in EXTRA_TAP) target = EXTRA_TAP[key];
  if (!target) return;
  select(target);
  if (compsByKey[key]) highlight(key);
}
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved < 8 && dt < 450) pick(e.clientX, e.clientY);
});

    let vis;
    switch (e.cat) {
      case 'dot': vis = current === null; break;

      case 'qtop': vis = current === 'vasi'; break;

function frame() {
  if (!$('mech').hidden) { clock.getDelta(); requestAnimationFrame(frame); return; }  // dettaglio aperto: scena principale in pausa
  const dt = Math.min(clock.getDelta(), .05);
  updateCycle(dt);
  boxG.position.x = S.bx;
  pivot.rotation.x = -rad(S.arm);
  if (window.MAINM) window.MAINM.update(S.bx, S.arm);
  updateHose(S.bx);
  if (current === 'braccetto') {
    clipPlanes[0].constant = S.bx + 1; clipPlanes[1].constant = -(S.bx - 18); qSide.position.x = S.bx - 100;
  }
  explodeT += (explodeTarget - explodeT) * Math.min(1, dt * 6);
  if (Math.abs(explodeTarget - explodeT) < .001) explodeT = explodeTarget;
  const ek = ease(Math.min(1, Math.max(0, explodeT)));
  for (const k in parts) parts[k].g.position.copy(parts[k].off).multiplyScalar(ek);
  const glow = S.watering ? .55 + .25 * Math.sin(performance.now() / 120) : 0;
  pompaMat.emissive.setHex(0x2a7de1); pompaMat.emissiveIntensity = glow;
  valvMat.emissive.setHex(0x2a7de1); valvMat.emissiveIntensity = glow;
  updateDrops(dt, S.watering);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / .9);
    const k = ease(tween.t);
    if (tween.followBox) tween.tt.set(S.bx, 67, 8);
    camera.position.lerpVectors(tween.fp, tween.tp, k);
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    if (tween.t >= 1) { tween = null; controls.enabled = true; }
  }
  if (window.AMB_PRONTO) ambienteFrame(dt);
  controls.update();
  if (window.AMB_PRONTO) vincolaCamera();
  if (hl) hl.update();
  refreshLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (window.AMB_PRONTO) disponiEtichetteMain();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const Mecc = (() => {

  /* ---------- materiali PBR (aspetto reale) + colore per funzione ---------- */
  const REALE = {
    alluminio: { color: 0xc9cdd2, metalness: 1, roughness: .42 },   // anodizzato satinato
    zincato: { color: 0xc6ccd4, metalness: 1, roughness: .3 },      // acciaio zincato (minuteria)
    acciaio: { color: 0xb0b5ba, metalness: 1, roughness: .28 },
    cuscinetto: { color: 0xdde1e5, metalness: 1, roughness: .14 },
    pom: { color: 0xf1f0ea, metalness: 0, roughness: .45 },
    pomNero: { color: 0x2a2c2f, metalness: 0, roughness: .5 },
    nema: { color: 0x1e2023, metalness: .45, roughness: .45 },
    petg: { color: 0xe3e8ee, metalness: 0, roughness: .28, transparent: true, opacity: .3, depthWrite: false },
    petgPieno: { color: 0xa3abb4, metalness: 0, roughness: .55 },
    verniciato: { color: 0x3b4047, metalness: .3, roughness: .6 },
    nylon: { color: 0x222427, metalness: 0, roughness: .6 },
    morsetto: { color: 0x2f8a52, metalness: 0, roughness: .5 },
    servo: { color: 0x2f6fd0, metalness: 0, roughness: .35 },
    ottone: { color: 0xc9a24a, metalness: 1, roughness: .35 },
    tubetto: { color: 0x9fd0f5, metalness: 0, roughness: .3, transparent: true, opacity: .75 },
    scuro: { color: 0x15171a, metalness: .2, roughness: .6 }
  };
  const matCache = {};
  let modoFunzione = true;
  function applyMode(m) {
    const u = m.userData;

    else { m.color.copy(u.reale); m.metalness = u.metal; m.roughness = u.rough; }

    m.userData = { reale: new THREE.Color(r.color), funz: func ? new THREE.Color(CONFIG.aspetto.funzioni[func]) : null, metal: r.metalness, rough: r.roughness };

  const EDGE = new THREE.LineBasicMaterial({ color: 0x59636f, transparent: true, opacity: .45 });
  const QMAT = new THREE.LineBasicMaterial({ color: 0x5b4a00, depthTest: false, transparent: true });

  let D = null, root = null, car = null, rotor = null, pivot = null, hoseMesh = null, bodies = [], results = [], viti = [], armDeg = 0;
  // esploso: nodo, spostamento (nello spazio del genitore), posizione di montaggio
  let EXP = [];
  function ex(nodes, v) { for (const n of nodes) if (n) EXP.push({ n, v: v.clone(), b: n.position.clone() }); return nodes; }

  /* ---------- quote derivate (solo formule su CONFIG) ---------- */
  function derive() {
    const C = CONFIG, t = C.tubo, cr = C.cremagliera, pg = C.pignone, mo = C.motore, ru = C.ruote, ec = C.eccentrico,
      bx = C.box, sv = C.servo, br = C.braccetto, ri = C.ringhiera, st = C.staffe, mt = C.morsettiere, ec_ = C.eccentrico, Mv = C.iso[ru.vite], ma = C.manicotto, as = C.staffe.asole;
    const d = {};
    d.h = t.lato / 2;
    d.m = cr.modulo; d.alpha = cr.angoloPressione * D2R; d.p = Math.PI * d.m;
    d.yPitch = d.h + cr.altezzaPrimitiva;
    d.yRoot = d.yPitch - cr.dedendum * d.m; d.yTip = d.yPitch + cr.addendum * d.m; d.yRackTop = d.h + cr.altezza;
    d.hwRoot = d.p / 4 + cr.dedendum * d.m * Math.tan(d.alpha);
    d.hwTip = d.p / 4 - cr.addendum * d.m * Math.tan(d.alpha);
    d.nDenti = Math.floor(cr.spezzone / d.p + 1e-9); d.Lseg = d.nDenti * d.p;  // spezzone a passo continuo
    d.r = d.m * pg.denti / 2; d.ra = d.r + cr.addendum * d.m; d.rf = d.r - cr.dedendum * d.m; d.rb = d.r * Math.cos(d.alpha);
    d.yAxis = d.yPitch + d.r;                       // ingranamento: centro = linea primitiva + raggio primitivo
    d.mmGiro = Math.PI * d.m * pg.denti;
    d.zF = pg.larghezza / 2 - mo.alberoL;           // faccia motore: punta dell'albero a filo del pignone
    d.zMot0 = d.zF - mo.lunghezza;
    d.zConn0 = d.zMot0 - mo.connettore.sporgenza;
    d.g = bx.gioco; d.w = bx.parete;
    d.zRight = d.h - bx.arretramentoBracci;
    d.yMotBot = d.yAxis - mo.lato / 2; d.yMotTop = d.yAxis + mo.lato / 2;
    // ruote
    d.Ro = ru.diametro / 2; d.half = ru.larghezza / 2; d.Rhub = ru.foro / 2;
    d.gHalf = Math.min(d.half, ru.profonditaGola * Math.tan(ru.angoloGola / 2 * D2R));

    d.yBotIn = Math.min(d.yShank - d.ecc - d.Ro, d.yLat - d.half - ru.spallamento.l - d.kT, d.yShank - ec_.esagono / SQ3) - d.g;

  /* ---------- cremagliera: profilo trapezio ISO 53 ---------- */
  function rackGeo(xa, xb) {

  /* ---------- pignone: profilo a evolvente ricavato da formula ---------- */
  function pinionGeo() {
    const pg = CONFIG.pignone, z = pg.denti, n = CONFIG.render.evolvente;
    const inv = a => Math.tan(a) - a;
    const beta = rho => Math.PI / (2 * z) + inv(D.alpha) - (rho > D.rb ? inv(Math.acos(D.rb / rho)) : 0);
    const P = (r, a) => v2(r * Math.cos(a), r * Math.sin(a));
    const r0 = Math.max(D.rf, D.rb), pts = [];
    for (let i = 0; i < z; i++) {
      const psi = i * 2 * Math.PI / z;
      if (D.rf < r0) pts.push(P(D.rf, psi - beta(D.rf)));
      for (let k = 0; k <= n; k++) { const rho = r0 + (D.ra - r0) * k / n; pts.push(P(rho, psi - beta(rho))); }
      const bt = beta(D.ra);
      for (let k = 1; k < 3; k++) pts.push(P(D.ra, psi - bt + 2 * bt * k / 3));
      for (let k = n; k >= 0; k--) { const rho = r0 + (D.ra - r0) * k / n; pts.push(P(rho, psi + beta(rho))); }

  /* ---------- parte fissa: tubo, cremagliera, staffe, ringhiera ---------- */

    const x0 = C.vista.inizio, x1 = x0 + C.vista.lunghezza;
    const sh = rr(t.lato, t.lato, t.raggioEsterno), wi = t.lato - 2 * t.spessore;
    sh.holes.push(rr(wi, wi, Math.max(0, t.raggioEsterno - t.spessore), true));
    const tg = new THREE.ExtrudeGeometry(sh, { depth: x1 - x0, bevelEnabled: false, curveSegments: C.render.spigolo });
    tg.rotateY(-Math.PI / 2); tg.translate(x1, 0, 0);

    const xa = cr.inizio + Math.ceil((x0 - cr.inizio) / D.p - 1e-9) * D.p, xb = cr.inizio + Math.floor((x1 - cr.inizio) / D.p + 1e-9) * D.p;

      mesh(G, rackGeo(a, b), MAT('pom', 'trasmissione'), 'crem_' + k, 'crem_' + k);
      const sv = iso[cr.vite];
      for (let xs = s0 + cr.primaVite; xs < s1; xs += cr.passoViti) if (xs > a && xs < b) {
        const base = v3(xs, D.yRoot - cr.giocoTestaFondo - sv.k, 0);
        ex(vite(G, `viteCrem_${Math.round(xs)}`, cr.vite, stdLen(base.y - D.h + t.spessore + cr.inserto), base, v3(0, -1, 0), ['crem_', 'tubo'], ['crem_']), v3(0, 30, 0));
      }
    }

    const R_ = MAT('verniciato'), ma = C.manicotto, fa = C.fascette, as = st.asole;
    const nearPost = x => { const k = Math.round((x - ri.primoMontante) / ri.passoMontanti); return Math.abs(x - (ri.primoMontante + k * ri.passoMontanti)) < 1e-6; };

      const xf = ri.inizioFerri + k * ri.passoFerri;

    const sv = iso[st.vite], yM = (st.yBasso + st.yAlto) / 2, t3 = st.spessore;
    D.staffe = [];
    for (let xb_ = st.prima; xb_ < t.lunghezza; xb_ += st.passo) {
      if (!D.ferri.includes(xb_) || xb_ + t3 / 2 - st.larghezza < x0) continue;
      D.staffe.push(xb_);
      const id = 'staffa_' + xb_, xa1 = xb_ + t3 / 2, xa0 = xa1 - st.larghezza;
      boxMM(G, xa0, xa1, st.yBasso, st.yAlto, D.h, D.h + t3, AL, id + '_A', id, { r: C.smussi.alluminio });
      boxMM(G, xb_ - t3 / 2, xb_ + t3 / 2, st.yBasso, st.yAlto, D.h + t3, D.zTall, AL, id + '_B', id, { r: C.smussi.alluminio });

      for (const sy of [-1, 1]) { const yc = as.yCentro + sy * as.interasse / 2, hp = new THREE.Path();

      mm.position.set(xb_, as.yCentro, D.zFerroC);
      for (const sy of [-1, 1]) {
        const fid = `fascetta_${xb_}_${sy > 0 ? 'a' : 'b'}`, y = as.yCentro + sy * as.interasse / 2;
        const fm = mesh(G, tieGeo(xb_, y), MAT('nylon'), fid, fid, { allow: ['manicotto_', 'ferro_', 'staffa_'] });
        const zb = D.zFerroC + ri.ferro / 2 + ma.spessore + fa.spessore;      // testina dietro il ferro, lontano dal tubo

  // fascetta: nastro chiuso nel piano orizzontale, passa nell'asola e avvolge il manicotto del ferro
  function tieGeo(xf, y) {
    const C = CONFIG, fa = C.fascette, tb = fa.spessore, hw = fa.larghezza / 2, xo = C.staffe.spessore / 2 + tb / 2;
    const Rl = C.ringhiera.ferro / 2 + C.manicotto.spessore + tb / 2, zc = D.zFerroC, th0 = Math.asin(Math.min(1, xo / Rl));
    const P = [[-xo, D.zSlot], [xo, D.zSlot]];
    for (let i = 0; i <= 24; i++) { const th = th0 + (2 * Math.PI - 2 * th0) * i / 24; P.push([Rl * Math.sin(th), zc - Rl * Math.cos(th)]); }
    const n = P.length, pos = [], idx = [];
    for (let i = 0; i < n; i++) {
      const [ax, az] = P[(i - 1 + n) % n], [bx, bz] = P[(i + 1) % n]; let tx = bx - ax, tz = bz - az; const l = Math.hypot(tx, tz); tx /= l; tz /= l;
      const nx = tz, nz = -tx, [px, pz] = P[i];
      for (const [o, dy] of [[-1, -1], [-1, 1], [1, 1], [1, -1]]) pos.push(xf + px + nx * o * tb / 2, y + dy * hw, pz + nz * o * tb / 2);
    }
    for (let i = 0; i < n; i++) { const a = i * 4, b = ((i + 1) % n) * 4;
      for (let f = 0; f < 4; f++) { const f1 = (f + 1) % 4; idx.push(a + f, b + f, b + f1, a + f, b + f1, a + f1); } }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    return g;
  }

  /* ---------- carrello ---------- */

  /* ---------- controlli automatici ---------- */
  function relMatrix(o) { return new THREE.Matrix4().copy(root.matrixWorld).invert().multiply(o.matrixWorld); }
  function obbOf(b) {
    const geo = b.mesh.geometry; if (!geo.boundingBox) geo.computeBoundingBox();
    const M = relMatrix(b.mesh), bb = geo.boundingBox;
    if (b.circ) {
      const a2 = AXZ.clone().transformDirection(M), ref = Math.abs(a2.x) < .9 ? AXX : AXY;
      const a0 = ref.clone().addScaledVector(a2, -ref.dot(a2)).normalize(), a1 = v3().crossVectors(a2, a0);
      return { c: bb.getCenter(v3()).applyMatrix4(M), ax: [a0, a1, a2], ex: [b.circ.r, b.circ.r, b.circ.l / 2] };
    }
    const c = bb.getCenter(v3()).applyMatrix4(M), e = bb.getSize(v3()).multiplyScalar(.5);
    const ax = [v3(), v3(), v3()]; M.extractBasis(ax[0], ax[1], ax[2]);
    const ex = [e.x * ax[0].length(), e.y * ax[1].length(), e.z * ax[2].length()];
    ax.forEach(a => a.normalize()); return { c, ax, ex };
  }
  const zMaxOf = o => o.c.z + o.ax.reduce((s, a, i) => s + Math.abs(a.z) * o.ex[i], 0);
  function sweepX(o) {
    const k = o.ax.findIndex(a => Math.abs(a.x) > .9999);
    if (k >= 0) { const ex = o.ex.slice(); ex[k] = 1e6; return { c: o.c, ax: o.ax, ex }; }
    const h = [0, 1, 2].map(j => o.ax.reduce((s, a, i) => s + Math.abs(a.getComponent(j)) * o.ex[i], 0));
    return { c: o.c, ax: [AXX, AXY, AXZ], ex: [1e6, h[1], h[2]] };
  }
  function sat(A, B) {
    const axes = [...A.ax, ...B.ax];
    for (const a of A.ax) for (const b of B.ax) { const c = v3().crossVectors(a, b); if (c.lengthSq() > 1e-10) axes.push(c.normalize()); }
    const d = v3().subVectors(B.c, A.c); let min = Infinity;
    for (const L of axes) {
      const rA = A.ex[0] * Math.abs(A.ax[0].dot(L)) + A.ex[1] * Math.abs(A.ax[1].dot(L)) + A.ex[2] * Math.abs(A.ax[2].dot(L));
      const rB = B.ex[0] * Math.abs(B.ax[0].dot(L)) + B.ex[1] * Math.abs(B.ax[1].dot(L)) + B.ex[2] * Math.abs(B.ax[2].dot(L));
      min = Math.min(min, rA + rB - Math.abs(d.dot(L)));
    }
    return min;
  }
  const allowed = (A, B) => A.asm === B.asm || A.allow.some(p => B.id.startsWith(p)) || B.allow.some(p => A.id.startsWith(p));
  function sdTube(z, y) {
    const t = CONFIG.tubo, r = t.raggioEsterno, b = t.lato / 2;
    const qx = Math.abs(z) - b + r, qy = Math.abs(y) - b + r;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
  }
  function wheelContact(b) {
    const M = relMatrix(b.mesh), c = v3().applyMatrix4(M), ax = AXY.clone().transformDirection(M);
    const u = v2(ax.z, ax.y).normalize(); let n = v2(-u.y, u.x); if (n.x * -c.z + n.y * -c.y < 0) n.negate();
    const prof = wheelProfile(), seg = [];
    for (let i = 0; i < prof.length - 1; i++) {
      const [r0, a0] = prof[i], [r1, a1] = prof[i + 1]; let mn = Infinity;
      for (let k = 0; k <= 400; k++) {
        const f = k / 400, a = a0 + (a1 - a0) * f, rr_ = r0 + (r1 - r0) * f;
        mn = Math.min(mn, sdTube(c.z + a * u.x + rr_ * n.x, c.y + a * u.y + rr_ * n.y));
      }
      seg.push(mn);
    }
    return { min: Math.min(...seg), seg };
  }
  function interferenze() {
    root.updateMatrixWorld(true);
    const ob = bodies.map(b => ({ b, o: obbOf(b) })); let n = 0; const bad = [];
    for (let i = 0; i < ob.length; i++) for (let j = i + 1; j < ob.length; j++) {
      const A = ob[i], Bq = ob[j]; if (allowed(A.b, Bq.b)) continue; n++;
      const ov = sat(A.o, Bq.o); if (ov > CONFIG.tolleranze.compenetrazione) bad.push(`${A.b.id} ↔ ${Bq.b.id} (${fmt(ov, 2)} mm)`);
    }
    return { n, bad, ob };
  }
  function sweptMin(ob, test) {
    let g = Infinity, who = '';
    const F = ob.filter(q => !q.b.mob && test(q.b.id)), Mv = ob.filter(q => q.b.mob);
    for (const f of F) for (const m of Mv) { const gap = -sat(sweepX(m.o), f.o); if (gap < g) { g = gap; who = `${m.b.id} ↔ ${f.b.id}`; } }
    return { g, who };
  }
  function runChecks() {
    const C = CONFIG, tol = C.tolleranze, cr = C.cremagliera, out = [];
    const add = (gruppo, nome, ok, dett, warn) => out.push({ gruppo, nome, ok: !!ok, dett, warn: !!warn });
    root.updateMatrixWorld(true);
    // 1) ingranamento (misurato sul modello costruito)
    const pin = bodies.find(b => b.id === 'pignone'), racks = bodies.filter(b => /^crem_\d+$/.test(b.id));
    const pc = v3().applyMatrix4(relMatrix(rotor));
    const pp = pin.mesh.geometry.attributes.position; let raG = 0, rfG = Infinity;
    for (let i = 0; i < pp.count; i++) { const r = Math.hypot(pp.getX(i), pp.getY(i)); raG = Math.max(raG, r); if (r > C.pignone.foro / 2 + .01) rfG = Math.min(rfG, r); }
    const rp = racks[0].mesh.geometry.attributes.position; let yTipG = -Infinity, yRootG = Infinity;
    for (let i = 0; i < rp.count; i++) { const y = rp.getY(i); yTipG = Math.max(yTipG, y); if (y > D.h + .01) yRootG = Math.min(yRootG, y); }
    const yPitchG = yTipG - cr.addendum * D.m, cMin = .25 * D.m;
    add('Ingranamento', 'Centro pignone − linea primitiva = raggio primitivo', Math.abs(pc.y - yPitchG - D.r) <= tol.ingranamento, `${fmt(pc.y - yPitchG, 3)} mm (r = ${fmt(D.r, 3)})`);
    add('Ingranamento', 'Gioco testa pignone − fondo cremagliera', (pc.y - raG) - yRootG >= cMin - tol.ingranamento, `${fmt((pc.y - raG) - yRootG, 3)} mm (min ${fmt(cMin, 2)})`);
    add('Ingranamento', 'Gioco testa cremagliera − fondo pignone', (pc.y - rfG) - yTipG >= cMin - tol.ingranamento, `${fmt((pc.y - rfG) - yTipG, 3)} mm (min ${fmt(cMin, 2)})`);
    const fw = Math.min(C.pignone.larghezza / 2, cr.larghezza / 2) - Math.max(-C.pignone.larghezza / 2, -cr.larghezza / 2);
    add('Ingranamento', 'Larghezza di dentatura in presa', fw >= C.pignone.larghezza - tol.ingranamento, `${fmt(fw, 1)} mm su ${fmt(C.pignone.larghezza, 1)}`);
    const step = 2 * Math.PI / C.pignone.denti; let rel = ((rotor.rotation.z + Math.PI / 2) % step + step) % step; if (rel > step / 2) rel -= step;
    let dg = ((pc.x + D.r * rel - cr.inizio) % D.p + D.p) % D.p; if (dg > D.p / 2) dg -= D.p;
    add('Ingranamento', 'Fase: dente del pignone centrato nel vano', Math.abs(dg) <= tol.ingranamento, `errore ${fmt(dg, 3)} mm`);
    const eps = (Math.sqrt(D.ra * D.ra - D.rb * D.rb) - D.r * Math.sin(D.alpha) + cr.addendum * D.m / Math.sin(D.alpha)) / (D.p * Math.cos(D.alpha));
    add('Ingranamento', 'Rapporto di condotta ≥ 1,2', eps >= 1.2, `ε = ${fmt(eps, 3)}`);
    add('Ingranamento', 'Corsa per giro = π·m·z', true, `${fmt(D.mmGiro, 2)} mm/giro`);
    for (const J of D.giunzioni) {
      const pitch = (J + D.p / 2) - (J - D.p / 2);
      add('Ingranamento', `Giunzione a X = ${fmt(J, 2)}: passo continuo`, Math.abs(pitch - D.p) <= tol.ingranamento,
        `passo ${fmt(pitch, 4)} mm; spezzone = ${D.nDenti} denti = ${fmt(D.Lseg, 2)} mm (${fmt(D.Lseg - cr.spezzone, 2)} sul nominale)`);
    }
    // 2) contatto delle ruote
    for (const b of bodies.filter(b => /^ruota(SupDx|SupSx|Lat|Inf)_[AB]$/.test(b.id))) {
      const r = wheelContact(b), top = b.id.startsWith('ruotaSup');
      const val = top ? Math.max(Math.abs(r.seg[2]), Math.abs(r.seg[3])) : Math.abs(r.min);
      const nome = { SupDx: 'superiore destra', SupSx: 'superiore sinistra', Lat: 'laterale', Inf: 'inferiore (eccentrico)' }[b.id.slice(5, -2)];
      add('Ruote', `Ruota ${nome} ${b.id.slice(-1)} tocca il tubo`, val <= tol.contatto && r.min >= -tol.contatto,
        top ? `fianchi a ${fmt(r.seg[2], 3)} / ${fmt(r.seg[3], 3)} mm dalle facce` : `distanza ${fmt(r.min, 3)} mm`);
    }
    const rs = C.tubo.raggioEsterno, lc = Math.hypot(D.gHalf, C.ruote.profonditaGola) - rs;
    add('Ruote', `Spigolo del tubo R ≤ ${fmt(tol.raggioSpigoloMax, 1)} mm (appoggio della gola sui fianchi)`, true,
      rs > tol.raggioSpigoloMax ? `WARNING: R ${fmt(rs, 2)} mm — la gola non appoggia sui fianchi` : `R ${fmt(rs, 2)} mm; appoggio utile per fianco ${fmt(lc, 2)} mm`, rs > tol.raggioSpigoloMax);
    // 3) bracci
    const zMaxG = Math.max(...bodies.filter(b => b.guscio).map(b => zMaxOf(obbOf(b))));
    add('Box', 'Bracci a filo della faccia destra (nessuna sporgenza)', zMaxG - D.h <= tol.contatto, `sporgenza ${fmt(zMaxG - D.h, 2)} mm`);
    // 4) compenetrazioni: braccetto a riposo e abbassato
    const a0 = armDeg; setArm(0); const I0 = interferenze(); setArm(C.braccetto.angolo); const I1 = interferenze(); setArm(a0);
    const bad = [...new Set([...I0.bad, ...I1.bad])];
    add('Compenetrazioni', 'Nessuna compenetrazione tra parti (braccetto 0° e ' + fmt(C.braccetto.angolo, 0) + '°)', bad.length === 0,
      `${I0.n} coppie controllate` + (bad.length ? ': ' + bad.slice(0, 8).join('; ') : ''));
    // 5) corsa: staffe, viti cremagliera, ringhiera
    const ob = I0.ob;
    const sS = sweptMin(ob, id => id.startsWith('staffa'));
    add('Corsa', `Passaggio sulle staffe (gioco ≥ ${fmt(tol.giocoMin, 1)} mm)`, sS.g >= tol.giocoMin - 1e-9, `gioco minimo ${fmt(sS.g, 2)} mm (${sS.who})`);
    const sR = sweptMin(ob, id => id.startsWith('viteCrem'));
    add('Corsa', 'Nessun urto con le viti della cremagliera', sR.g >= -tol.compenetrazione, `gioco minimo ${fmt(sR.g, 2)} mm`);
    const sF = sweptMin(ob, id => /^(ferro|manicotto)/.test(id)), sM_ = sweptMin(ob, id => id.startsWith('montante'));
    const gR = Math.min(sF.g, sM_.g); D.giocoRinghiera = { ferri: sF.g, montanti: sM_.g };
    const manca = tol.giocoRinghiera - gR;
    add('Ringhiera', `Gioco ruota–ringhiera ≥ ${fmt(tol.giocoRinghiera, 0)} mm lungo la corsa (ferri e montanti)`, gR >= tol.giocoRinghiera - 1e-9,
      `ferri ${fmt(sF.g, 2)} mm, montanti ${fmt(sM_.g, 2)} mm (${(sM_.g < sF.g ? sM_ : sF).who})` + (manca > 1e-9 ? ` — MANCANO ${fmt(manca, 2)} mm: distanza ringhiera ≥ ${fmt(C.ringhiera.distanza + manca, 1)} mm` : ''));
    // fascette: mai sul tubo né sulle tracce delle ruote
    const fas = ob.filter(q => q.b.id.startsWith('fascetta')), tubo = ob.find(q => q.b.id === 'tubo');
    const gT = Math.min(...fas.map(q => -sat(q.o, tubo.o))), sFa = sweptMin(ob, id => id.startsWith('fascetta'));
    add('Fissaggio', 'Fascette lontane dal tubo', gT > tol.contatto, `distanza minima ${fmt(gT, 2)} mm`);
    add('Fissaggio', `Fascette fuori dalla corsa del carrello (gioco ≥ ${fmt(tol.giocoMin, 1)} mm)`, sFa.g >= tol.giocoMin, `gioco minimo ${fmt(sFa.g, 2)} mm (${sFa.who})`);
    const fa = C.fascette, as = C.staffe.asole;
    add('Fissaggio', 'Fascetta passa nelle asole', fa.larghezza < as.l && fa.spessore < as.w, `nastro ${fmt(fa.larghezza, 1)} x ${fmt(fa.spessore, 1)} in asola ${fmt(as.l, 0)} x ${fmt(as.w, 0)}`);
    add('Fissaggio', 'Staffe sui ferri (interasse multiplo del passo dei ferri)', D.staffe.length > 0 && Math.abs((C.staffe.passo / C.ringhiera.passoFerri) % 1) < 1e-9,
      `staffe a X ${D.staffe.join(', ')}; interasse ${fmt(C.staffe.passo, 0)} = ${fmt(C.staffe.passo / C.ringhiera.passoFerri, 2)} ferri`);
    add('Fissaggio', 'Asole dentro la parte alta della staffa', D.zSlot - as.w / 2 - D.zTall >= tol.giocoMin, `${fmt(D.zSlot - as.w / 2 - D.zTall, 2)} mm dal bordo`);
    const zRm = Math.max(...bodies.filter(b => /^ruotaSupDx_[AB]$/.test(b.id)).map(b => zMaxOf(obbOf(b))));   // solo la ruota (il riquadro della testa bombata è più largo della testa)
    add('Ringhiera', 'Sporgenza ruota sup. destra: modello = CONFIG', Math.abs(zRm - D.zRuotaMax) <= tol.contatto,
      `modello ${fmt(zRm - D.h, 2)} mm, CONFIG ${fmt(C.ruote.sporgenzaSupDx, 2)} mm`);
    const s = CONFIG.iso[CONFIG.motore.viteFori];
    add('Minuteria', 'Viti motore: impegno ≤ profondità del filetto', D.viteMotore.impegno <= CONFIG.motore.profonditaFiletto + 1e-9 && D.viteMotore.impegno >= 1.5 * s.d,
      `M3x${D.viteMotore.L}: impegno ${fmt(D.viteMotore.impegno, 1)} mm (filetto ${fmt(CONFIG.motore.profonditaFiletto, 1)}, min 1,5·d)`);
    return out;
  }

  const esito = r => r.warn ? 'WARN' : r.ok ? 'PASS' : 'FAIL';

    for (const r of results) console.log(`%c${esito(r)}%c [${r.gruppo}] ${r.nome} — ${r.dett}`, `font-weight:bold;color:${r.warn ? '#9a6b00' : r.ok ? '#16723a' : '#b3261e'}`, 'color:inherit');

// --- texture procedurali (CanvasTexture) ---

    }

}
// intonaco chiaro: rumore leggero
function texIntonaco() {
  return canvas(MOBILE ? 256 : 512, (g, n) => {
    g.fillStyle = '#ece6dc'; g.fillRect(0, 0, n, n);
    for (let k = 0; k < n * n / 6; k++) { const v = rnd(); g.fillStyle = v > .5 ? `rgba(255,255,255,${(v - .5) * .25})` : `rgba(120,105,90,${v * .12})`; g.fillRect(rnd() * n, rnd() * n, 1 + rnd() * 2, 1 + rnd() * 2); }

}
// foglia con contorno (trasparenza con alphaTest)

// --- etichette della scena principale: stesso metodo anti-sovrapposizione del dettaglio ---
function disponiEtichetteMain() {
  const vb = vp.getBoundingClientRect(), M = 4, it = [], ob = [];
  for (const e of labels) {
    const el = e.d; if (!el || !e.o.visible || el.style.display === 'none') continue;
    el.style.visibility = '';

    const box = { x: r.left - vb.left, y: r.top - vb.top, w: r.width, h: r.height };
    if (e.cat === 'dot') ob.push(box); else it.push(Object.assign(box, { el, x0: box.x, y0: box.y }));
  }
  for (const id of ['vistePres', 'hint', 'bHome']) { const e = $(id); if (e && !e.hidden) { const r = e.getBoundingClientRect(); if (r.width) ob.push({ x: r.left - vb.left, y: r.top - vb.top, w: r.width, h: r.height }); } }
  for (let k = 0; k < 30; k++) {
    let mosso = false;
    for (let i = 0; i < it.length; i++) {
      const a = it[i];
      for (const b of [...it.slice(i + 1), ...ob]) {
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + M, oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) + M;
        if (ox <= 0 || oy <= 0) continue; mosso = true; const fisso = ob.includes(b);
        if (oy < ox) { const d = (a.y < b.y ? -1 : 1) * oy; if (fisso) a.y += d; else { a.y += d / 2; b.y -= d / 2; } }
        else { const d = (a.x < b.x ? -1 : 1) * ox; if (fisso) a.x += d; else { a.x += d / 2; b.x -= d / 2; } }
      }
      a.x = Math.max(M, Math.min(vb.width - a.w - M, a.x)); a.y = Math.max(M, Math.min(vb.height - a.h - M, a.y));
    }
    if (!mosso) break;
  }
  // ultima passata: nasconde le etichette che restano sovrapposte o finiscono lontane dal loro oggetto
  const tenute = [], urta = (a, b) => Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > 0 && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 0;
  for (const a of it) {
    if (Math.hypot(a.x - a.x0, a.y - a.y0) > 90 || tenute.some(b => urta(a, b)) || ob.some(b => urta(a, b))) { a.el.style.visibility = 'hidden'; continue; }
    tenute.push(a);
    if (a.x !== a.x0 || a.y !== a.y0) a.el.style.transform += ` translate(${(a.x - a.x0).toFixed(1)}px,${(a.y - a.y0).toFixed(1)}px)`;
  }
}

  const dPianta = (q, v) => { const dx = Math.hypot(q.x - v.x / 10, q.z - v.z / 10) - v.rS / 10, dy = q.y - v.top / 10; return dx > 0 && dy > 0 ? Math.hypot(dx, dy) : Math.max(dx, dy); };
  const hose = hoseTube.geometry.attributes.position;
  let gP = Infinity, gV = Infinity, gR = Infinity, gH = Infinity, wP = '', wH = '';
  // corsa reale: il carrello resta tutto sul tubo
  const Lt = (RAIL_X1 - RAIL_X0) * 10, bxMin = RAIL_X1 - (Lt - M.D.xHalf + M.D.xArm) / 10, bxMax = RAIL_X1 - (M.D.xHalf + M.D.xArm) / 10;
  out.push(['Corsa verificata', true, `braccetto da x ${bxMin.toFixed(1)} a ${bxMax.toFixed(1)} cm, passo 1 cm`]);
  for (const arm of [0, ARM_DEG]) for (let bx = bxMin; bx <= bxMax + 1e-9; bx += 1) {
    M.update(bx, arm); M.root.updateMatrixWorld(true); lastHoseX = null; updateHose(bx);
    const P = M.pivot.getWorldPosition(new THREE.Vector3()), T = M.tip();
    for (const v of AMB.vasi) { const g = seg(P, T, q => dPianta(q, v)) - rA; if (g < gP) { gP = g; wP = `${v.nome} a bx ${bx} cm, braccetto ${arm}°`; } }
    gR = Math.min(gR, seg(P, T, q => q.z - RAIL_BAR_R) - rA);
    const ph = hoseTube.geometry.attributes.position; let gh = Infinity;
    for (let i = 0; i < ph.count; i += 3) { const p = new THREE.Vector3(ph.getX(i), ph.getY(i), ph.getZ(i)); if (p.y > P.y + 1) continue; gh = Math.min(gh, seg(P, T, q => q.distanceTo(p))); }
    if (gh - rA - .5 < gH) { gH = gh - rA - .5; wH = `bx ${bx} cm, braccetto ${arm}°`; }
  }
  const yBox = RAIL_Y + M.D.yBotOut / 10, topMax = Math.max(...AMB.vasi.map(v => v.top / 10)); gV = yBox - topMax;
  out.push(['Piante e vasi ↔ braccetto/ugello (0° e 30°, tutta la corsa)', gP > 0, `gioco minimo ${gP.toFixed(1)} cm (${wP})`]);
  out.push(['Piante ↔ fondo del carrello', gV > 0, `gioco ${gV.toFixed(1)} cm`]);
  out.push(['Braccetto ↔ ferri della ringhiera', gR > 0, `gioco minimo ${gR.toFixed(1)} cm`]);
  out.push(['Braccetto ↔ tubo flessibile', gH > 0, `gioco minimo ${gH.toFixed(1)} cm (${wH})`]);
  POTS.forEach((x, i) => { M.update(x, ARM_DEG); const T = M.tip(), v = AMB.vasi[i], drift = .4 + 2 * Math.sqrt(2 * (T.y - v.h / 10) / 260);
    const d = Math.hypot(T.x - v.x / 10, T.z - v.z / 10) + drift; out.push([`Gocce dentro il vaso ${i + 1}`, d < v.rIn / 10, `ugello a ${(d - drift).toFixed(1)} cm dal centro (+${drift.toFixed(1)} deriva), raggio utile ${(v.rIn / 10).toFixed(1)} cm`]); });
  M.update(...salva); lastHoseX = null; updateHose(S.bx);
  for (const [n, ok, d] of out) console.log(`%c${ok ? 'PASS' : 'FAIL'}%c [Ambiente] ${n} — ${d}`, `font-weight:bold;color:${ok ? '#16723a' : '#b3261e'}`, 'color:inherit');
  return out;
}

// --- avvio ---
{
  const intonaco = texIntonaco();
  creaSfondo(); creaLuci(); miglioraPavimento(); creaSoletta(intonaco); creaMuro(intonaco); miglioraRinghiera(); creaVasi(); creaFascetteFilo();
  // meno draw call: unisci le parti statiche della presentazione
  const fisse = o => o === reelSpin || o === waterMesh || o === hoseTube || o === hoseCable || rings.includes(o) || o.userData.container || o === motSpin || o === idlerSpin;
  for (const g of [gWall, gSt, gBay, gPsu, gFuse, gBrd, gDrv, gSock, gCab, gTube, gWire, gTank, gPump, gReel, compsByKey.fc0, compsByKey.fc1, compsByKey.stazione]) if (g) unisci(g, fisse, false);
  window.AMB_UNISCI = unisciMeccanismo; unisciMeccanismo(window.MAINM);
  if (MOBILE) INQ.panoramica.w = 230;               // sul telefono (schermo verticale) la panoramica è più stretta
  Object.assign(GENERAL, INQ.panoramica);
  // etichette dell'ambiente (vista generale; sul telefono solo le principali)
  const S0 = AMB.vasi[1];
  label('Serbatoio e pompa', scene, V(19, 30, 30), 'amb', '', { prim: true });
  label('Vasi', scene, V(S0.x / 10, S0.h / 10 + 14, S0.z / 10 + 14), 'amb', '', { prim: true });
  label('Tubo flessibile sul filo', scene, V(120, HOSE_Y - 4, WIRE_Z), 'amb');
  label('Pavimento 30×30', scene, V(250, 1, 70), 'amb');
  select(null); if (tween) { camera.position.copy(tween.tp); controls.target.copy(tween.tt); tween = null; controls.enabled = true; }
  controls.minDistance = 30; controls.maxDistance = 900; controls.minPolarAngle = .08; controls.maxPolarAngle = Math.PI * .47;
  $('vistePres').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.q) inquadratura(b.dataset.q);
    else { AMB.modoT = AMB.modoT ? 0 : 1; b.textContent = AMB.modoT ? 'Tramonto' : 'Giorno'; b.classList.toggle('on', !!AMB.modoT); } });
  document.querySelector('#vistePres [data-q="panoramica"]').classList.add('on');
  window.AMB_PRONTO = true;
  if (DEV) { window.verificaAmbiente = verificaAmbiente; verificaAmbiente(); }
}
