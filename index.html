<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autopla</title>
<meta name="description" content="Robot che innaffia i vasi del balcone">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0b0b0c">
<link rel="preload" href="./asset/font/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<!-- v3: poster = stessa griglia tecnica dello sfondo CSS (il vecchio poster con l'erba non corrisponde più alla scena); nessuna immagine da scaricare -->
<style>#posterBox{z-index:1;pointer-events:none;background-color:#141517;background-image:radial-gradient(60% 55% at 50% 45%,#ffffff0b,#0000 70%),radial-gradient(circle,#ffffff29 1.2px,#0000 1.6px),linear-gradient(#ffffff0e 1px,#0000 1px),linear-gradient(90deg,#ffffff0e 1px,#0000 1px),linear-gradient(#ffffff06 1px,#0000 1px),linear-gradient(90deg,#ffffff06 1px,#0000 1px);background-position:0 0,-50px -50px,-1px -1px,-1px -1px,-1px -1px,-1px -1px;background-size:100% 100%,100px 100px,50px 50px,50px 50px,10px 10px,10px 10px;position:absolute;inset:0}#posterBox:after{content:"";background:radial-gradient(75% 70% at 50% 48%,#0b0b0c00 55%,#0b0b0c8c 100%);position:absolute;inset:0}</style>
  <script type="module" crossorigin src="./assets/index-CIuYJj7Z.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-4YRK8YfA.css">
</head>
<body>
<div id="app" class="nosheet">
  <header id="head">
    <div class="tt">
      <h1>Autopla</h1>
      <div class="sub">Robot che innaffia i vasi del balcone</div>
    </div>
    <div id="modo"><button id="bSistema" class="on" aria-pressed="true">Sistema</button><button id="bMecc" aria-pressed="false">Meccanismo</button></div>
    <button id="bCycle">▶ Ciclo</button>
  </header>

  <div id="viewport">
    <div id="loading">Caricamento…</div>
    <div id="posterBox" data-v3 aria-hidden="true"></div><script>(window.__tempi=window.__tempi||{}).poster=performance.now()</script>
    <div id="hint">Tocca un numero o un pezzo · tocca la box per il dettaglio</div>
    <button id="bHome" title="Rimetti la vista" aria-label="Rimetti la vista">⟲</button>
    <div id="vistePres"><button data-q="panoramica">Panoramica</button><button data-q="rotaia">Rotaia e vasi</button><button data-q="segui">Segui il carrello</button><button data-q="eccentrico">Eccentrico</button><button data-q="pompa">Pompa &amp; Galleggiante</button><button data-q="servo">Servo &amp; Ugello</button></div>
  </div>

  <section id="sheet" hidden>
    <div id="sheetHead">
      <div class="badge" id="sheetBadge">1</div>
      <div class="ht"><div id="sheetTitle"></div><div id="sheetSub"></div></div>
      <button id="sheetClose" aria-label="Chiudi">✕</button>
    </div>
    <div id="sheetBody"></div>
  </section>

  <nav id="parts"></nav>
</div>

<div id="mech" hidden>
  <header id="mechHead">
    <div class="tt"><h2>Meccanismo</h2><div class="sub" id="mechSub">Gemello digitale del meccanismo</div></div>
    <button id="mechColor">Colori: funzioni</button>
    <button id="mechCk">Controlli</button>
    <button id="mechClose" aria-label="Chiudi">✕</button>
  </header>
  <div id="mechView"><div id="mechChecks"></div><div id="mechInfo" hidden></div><div id="mechLegend"></div><div id="mechPanel" hidden></div>
    <svg id="mechLines"></svg><div id="mechTags"></div>
    <div id="mechScale" hidden><div id="mechScaleBar"></div><span id="mechScaleT"></span></div></div>
  <nav id="mechBar">
    <button data-a="animazione">▶ Animazione</button><button data-a="esploso">Esploso</button><button data-a="sezione">Sezione</button>
    <button data-a="eccentrico">Eccentrico</button><button data-a="trasparenza">Trasparenza box</button><button data-a="etichette">Etichette</button>
    <button data-v="fronte">Fronte</button><button data-v="lato">Lato</button><button data-v="alto">Alto</button><button data-v="iso">Isometrica</button>
    <button data-a="reset">⟲ Reset</button>
  </nav>
</div>

</body>
</html>
